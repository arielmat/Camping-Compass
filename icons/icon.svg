<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Playa sun">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e2bc"/>
      <stop offset="100%" stop-color="#e6c98f"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="45%" stop-color="#d7a53f"/>
      <stop offset="75%" stop-color="#e08a3c"/>
      <stop offset="100%" stop-color="#c05f3c"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>
  <!-- sun rays -->
  <g stroke="#e08a3c" stroke-width="16" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="60" x2="256" y2="120"/>
    <line x1="140" y1="110" x2="178" y2="158"/>
    <line x1="372" y1="110" x2="334" y2="158"/>
    <line x1="86" y1="228" x2="146" y2="238"/>
    <line x1="426" y1="228" x2="366" y2="238"/>
  </g>
  <!-- sun -->
  <circle cx="256" cy="236" r="98" fill="url(#sun)"/>
  <!-- playa dune horizon -->
  <path d="M0 360 Q 128 322 256 352 T 512 356 L512 512 L0 512 Z" fill="#c99a55"/>
  <path d="M0 402 Q 160 368 320 398 T 512 404 L512 512 L0 512 Z" fill="#b5843f"/>
</svg>
