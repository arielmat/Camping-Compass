<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#2a1c45"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ffe6b0"/>
      <stop offset="55%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff7a45"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a3a"/>
      <stop offset="1" stop-color="#12102a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <!-- sun glow -->
  <circle cx="256" cy="300" r="150" fill="url(#sun)" opacity="0.28"/>
  <!-- sun -->
  <circle cx="256" cy="300" r="78" fill="url(#sun)"/>
  <!-- rays -->
  <g stroke="#ffb347" stroke-width="12" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="150" x2="256" y2="186"/>
    <line x1="146" y1="190" x2="172" y2="216"/>
    <line x1="366" y1="190" x2="340" y2="216"/>
    <line x1="110" y1="300" x2="146" y2="300"/>
    <line x1="402" y1="300" x2="366" y2="300"/>
  </g>

  <!-- horizon / ground with a little tent -->
  <path d="M0 360 h512 v152 H0 Z" fill="url(#ground)"/>
  <path d="M0 360 h512" stroke="#ffb347" stroke-width="4" opacity="0.5"/>
  <!-- tent -->
  <g transform="translate(150,360)">
    <path d="M0 0 L44 -70 L88 0 Z" fill="#0b1026" stroke="#7cf3ff" stroke-width="6" stroke-linejoin="round"/>
    <path d="M44 -70 L44 0" stroke="#7cf3ff" stroke-width="5"/>
    <path d="M30 0 L44 -34 L58 0 Z" fill="#7cf3ff" opacity="0.35"/>
  </g>

  <!-- compass N marker -->
  <g transform="translate(340,120)">
    <circle r="42" fill="#0b1026" stroke="#7cf3ff" stroke-width="5"/>
    <path d="M0 -26 L12 10 L0 0 L-12 10 Z" fill="#ff8f7a"/>
    <path d="M0 26 L12 -10 L0 0 L-12 -10 Z" fill="#f4f6ff" opacity="0.7"/>
  </g>
</svg>
