name: Deploy to GitHub Pages

# Publishes the static app (index.html at the repo root) to GitHub Pages.
# Runs automatically when the app lands on the default branch, and can be
# triggered by hand from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token that can publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement lets the first run turn Pages on without visiting Settings.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is static; the root is the site.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
